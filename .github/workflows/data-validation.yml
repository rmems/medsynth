name: Data Validation

on:
  pull_request:
    paths:
      - "data/**"
      - "fixtures/**"
      - "schemas/**"
      - "scripts/**"
      - "crates/medsynth-schema/**"
      - "crates/medsynth-validate/**"
      - ".github/workflows/data-validation.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "fixtures/**"
      - "schemas/**"
      - "scripts/**"
      - "crates/medsynth-schema/**"
      - "crates/medsynth-validate/**"
      - ".github/workflows/data-validation.yml"

jobs:
  validate:
    name: data-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-validate-${{ hashFiles('Cargo.lock') }}

      - name: Run the validator over the corpus
        run: cargo run --locked -p medsynth-validate -- .

      - name: Fixture-behavior tests (gold passes / near-miss fails)
        run: cargo test --locked -p medsynth-validate --test fixtures_behavior
