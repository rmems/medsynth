config_version = "0"

# Qlty configuration for the medsynth Rust workspace. Plugins run via
# `qlty check --all` in CI (.github/workflows/ci.yml, job `qlty`).

[[source]]
name = "default"
default = true

[[plugin]]
name = "clippy"

[[plugin]]
name = "rustfmt"

[[plugin]]
name = "actionlint"

[[plugin]]
name = "markdownlint"

[[plugin]]
name = "trufflehog"
