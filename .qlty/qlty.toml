config_version = "0"

# Qlty configuration for the medsynth Rust workspace. Plugins run via
# `qlty check --all` in CI (.github/workflows/ci.yml, job `qlty`).
# No markdownlint: the repo's docs use long prose lines and its own table
# style — linting them is out of scope for this gate.

[[source]]
name = "default"
default = true

[[plugin]]
name = "clippy"

[[plugin]]
name = "rustfmt"

[[plugin]]
name = "actionlint"

[[plugin]]
name = "trufflehog"
