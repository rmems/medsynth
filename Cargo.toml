[workspace]
resolver = "2"
members = [
    "crates/medsynth-schema",
    "crates/medsynth-validate",
    "crates/medsynth-generate",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Shared dependencies are declared centrally; member crates opt in via
# `workspace = true` (see issue #6 implementation note for the base stack).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
schemars = "1"
jsonschema = "0.61"
thiserror = "2"
rand_pcg = "0.3"
# rand_pcg 0.3 implements the traits from rand_core 0.6. The generation crate
# needs RngCore/SeedableRng in scope to drive the seeded PCG stream; this is
# the matching trait crate, not a second RNG.
rand_core = "0.6"
reqwest = "0.13"
tokio = "1"
rayon = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
sha2 = "0.10"
scraper = "0.24"
ego-tree = "0.10"
parquet = "57"
hf-hub = "0.4"
tiktoken-rs = "0.9"
