[package]
name = "medsynth-validate"
description = "CI data-validation gate for medsynth: schema validation, key/rationale lint, anchor-presence, and a smoke originality screen over the records under data/ and fixtures/."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "medsynth-validate"

[dependencies]
medsynth-schema = { path = "../medsynth-schema" }
serde.workspace = true
serde_json.workspace = true
jsonschema.workspace = true
clap.workspace = true
anyhow.workspace = true
rayon.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
scraper.workspace = true

[dev-dependencies]
sha2.workspace = true
